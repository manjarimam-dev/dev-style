<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
        @theme {
        --font-inter: "Inter", sans-serif;
    }
</style>
</head>

<body class="bg-[#090d16] overflow-hidden">
    <main>
        <!-- navbar -->
        <nav class="bg-[#131b2e] flex justify-between items-center border-b border-blue-500/20 p-5 font-inter mb-3">
            <div class="text-4xl flex">
                <svg class="w-10 h-10" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="15" y1="15" x2="85" y2="85">
                            <stop offset="0%" stop-color="#7DB5FF" />
                            <stop offset="50%" stop-color="#4B83E8" />
                            <stop offset="100%" stop-color="#2456B8" />
                        </linearGradient>

                        <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <g stroke="url(#logoGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
                        filter="url(#blueGlow)">
                        <!-- Outer tilted logo -->
                        <path d="M20 35
         L78 17
         L65 78
         L23 82
         L34 67" />

                        <!-- Inner coding symbol -->
                        <path d="M34 45
         L43 39
         L52 43
         L45 54
         L34 58
         L29 51
         Z" />

                        <!-- Inner slash -->
                        <path d="M49 34
         L40 62" stroke-width="5" />
                    </g>
                </svg>
                <h2 class="font-semibold text-white cursor-pointer select-none">DevStyle</h2>
            </div>
            <p class="text-xl text-gray-300 select-none">Dhanbad, Jharkhand</p>
        </nav>

        <div class="flex gap-3">

            <!-- Left Side Panel -->
            <aside
                class="w-64 h-dvh bg-[#131b2e] text-white font-inter flex flex-col p-4 border-r border-blue-500/20 rounded-2xl select-none">
                <!-- Main Title Heading (DevStyle ke font aur theme se align karne ke liye) -->
                <div class="px-3 py-4 mb-4">
                    <h2 class="text-xl font-bold tracking-tight text-white">UI COMPONENTS</h2>
                </div>

                <!-- Navigation Links Container -->
                <div class="flex flex-col gap-1.5 w-full">

                    <!-- Header Item -->
                    <div
                        class="flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 cursor-pointer transition-all duration-200 group">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                            <path d="M3 9h18" />
                        </svg>
                        <span class="text-[15px] font-medium">Header</span>
                    </div>

                    <!-- Buttons Item (Active / Hover Status) -->
                    <div
                        class="flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-white bg-slate-800 cursor-pointer transition-all duration-200">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="6" width="18" height="12" rx="3" />
                            <path d="M6 9h12v6H6z" stroke-width="1.5" />
                        </svg>
                        <span class="text-[15px] font-semibold">Buttons</span>
                    </div>

                    <!-- Cards Item -->
                    <div
                        class="flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 cursor-pointer transition-all duration-200 group">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                            <path d="M3 9h18" />
                        </svg>
                        <span class="text-[15px] font-medium">Cards</span>
                    </div>

                    <!-- Inputs Item -->
                    <div
                        class="flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 cursor-pointer transition-all duration-200 group">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 12h18" />
                            <path d="M15 7l6 5-6 5" />
                            <path d="M3 7v10" />
                        </svg>
                        <span class="text-[15px] font-medium">Inputs</span>
                    </div>

                    <!-- Lists Item -->
                    <div
                        class="flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 cursor-pointer transition-all duration-200 group">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 5h12M9 12h12M9 19h12" />
                            <circle cx="4" cy="5" r="1" fill="currentColor" />
                            <circle cx="4" cy="12" r="1" fill="currentColor" />
                            <circle cx="4" cy="19" r="1" fill="currentColor" />
                        </svg>
                        <span class="text-[15px] font-medium">Lists</span>
                    </div>
                </div>
            </aside>
            
            <!-- center part of project , PREVIEW & CODE -->
            <div class="flex flex-col flex-1 gap-2">
                <div class="h-[65%] border-1 rounded-3xl border-blue-500/20 bg-[#111827]/80">
                    <h2 class="text-white m-5 font-inter select-none">LIVE PREVIEW</h2>

                </div>
                <div class="rounded-2xl h-[30%] border-1 border-blue-500/20 bg-[#111827]/80">
                    <h2 class="text-white m-5 font-inter select-none">CODE</h2>
                </div>
            </div>

            <!-- right side of Customizer -->
            <div class="w-80 bg-[#131b2e] border-l rounded-3xl border-blue-500/20">
                <h2 class="text-white m-5 font-inter select-none">CUSTOMIZER</h2>
            </div>
        </div>
    </main>
</body>

</html>
