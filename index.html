<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
        @theme {
        --font-inter: "Inter", sans-serif;
    }
</style>
</head>

<body class="bg-[#0d1117] overflow-hidden">
    <main>
        <!-- navbar -->
        <nav class="bg-[#161b22] flex justify-between items-center border-b border-slate-800 p-5 font-inter mb-3">
            <div class="text-4xl flex">
                <svg class="w-10 h-10" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="logoGradient" x1="15" y1="15" x2="85" y2="85">
                            <stop offset="0%" stop-color="#7DB5FF" />
                            <stop offset="50%" stop-color="#4B83E8" />
                            <stop offset="100%" stop-color="#2456B8" />
                        </linearGradient>

                        <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feMerge>
                                <feMergeNode in="blur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                    </defs>

                    <g stroke="url(#logoGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
                        filter="url(#blueGlow)">
                        <!-- Outer tilted logo -->
                        <path d="M20 35
         L78 17
         L65 78
         L23 82
         L34 67" />

                        <!-- Inner coding symbol -->
                        <path d="M34 45
         L43 39
         L52 43
         L45 54
         L34 58
         L29 51
         Z" />

                        <!-- Inner slash -->
                        <path d="M49 34
         L40 62" stroke-width="5" />
                    </g>
                </svg>
                <h2 class="font-semibold text-white cursor-pointer select-none">DevStyle<span
                        class="text-slate-100">.</span>
                </h2>
            </div>
            <p class="text-xl text-gray-300 select-none">Dhanbad, Jharkhand</p>
        </nav>

        <!-- Hero Section -->
        <div class="flex h-dvh gap-3">

            <!-- Left Side Panel -->
            <aside
                class="w-64 h-dvh bg-[#161b22] text-white font-inter flex flex-col p-4 border-r border-slate-800 rounded-2xl overflow-auto select-none">
                <!-- Main Title Heading -->
                <div class="px-3 py-4 mb-4">
                    <h2 class="text-xl font-bold tracking-tight text-white">UI COMPONENTS</h2>
                </div>

                <!-- Navigation Links Container -->
                <div id="navparent" class="flex flex-col gap-1.5 w-full cursor-pointer">

                    <!-- Header Item -->
                    <div id="header"
                        class="nav-btn flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 transition-all bg-[#0d1117] duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                            <path d="M3 9h18" />
                        </svg>
                        <span class="text-[15px] font-medium">Header</span>
                    </div>

                    <!-- Buttons Item -->
                    <div id="leftbtn"
                        class="nav-btn flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="6" width="18" height="12" rx="3" />
                            <path d="M6 9h12v6H6z" stroke-width="1.5" />
                        </svg>
                        <span class="text-[15px] font-semibold">Buttons</span>
                    </div>

                    <!-- Cards Item -->
                    <div id="card"
                        class="nav-btn flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="4" width="18" height="16" rx="2" />
                            <path d="M3 9h18" />
                        </svg>
                        <span class="text-[15px] font-medium">Cards</span>
                    </div>

                    <!-- Inputs Item -->
                    <div id="leftinpt"
                        class="nav-btn flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 12h18" />
                            <path d="M15 7l6 5-6 5" />
                            <path d="M3 7v10" />
                        </svg>
                        <span class="text-[15px] font-medium">Inputs</span>
                    </div>

                    <!-- Lists Item -->
                    <div id="leftlist"
                        class="nav-btn flex gap-3 items-center w-full px-3 py-2.5 rounded-lg text-slate-300 transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        <svg class="text-slate-400 group-hover:text-white transition-colors" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 5h12M9 12h12M9 19h12" />
                            <circle cx="4" cy="5" r="1" fill="currentColor" />
                            <circle cx="4" cy="12" r="1" fill="currentColor" />
                            <circle cx="4" cy="19" r="1" fill="currentColor" />
                        </svg>
                        <span class="text-[15px] font-medium">Lists</span>
                    </div>
                </div>
            </aside>

            <!-- center part of project , PREVIEW & CODE -->
            <div class="flex flex-col flex-1 gap-2 min-h-0">

                <!-- preview area -->
                <div
                    class="flex-2 border-1 rounded-3xl border-slate-800  bg-[#161b22] flex flex-col p-5 overflow-y-auto ">
                    <h2 class="text-white m-2 text-xl tracking-tight font-bold select-none">LIVE PREVIEW</h2>

                    <!-- live preview area inside the parent div -->
                    <div id="preview-area"
                        class="flex-1 flex items-center justify-center rounded-2xl bg-[#0d1117] border-slate-800 border-2 p-5 overflow-auto">

                    </div>
                </div>

                <!-- code area -->
                <div
                    class="rounded-2xl flex-1 border border-slate-800 bg-[#0d1117] flex flex-col overflow-hidden shadow-2xl">
                    <!-- Header Section (Editor Tab Bar) -->
                    <div
                        class="flex items-center justify-between px-5 py-3 border-b border-slate-800 bg-[#161b22] select-none">
                        <div class="flex items-center gap-2">
                            <!-- Mac style window dots -->
                            <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                            <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                            <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
                            <span
                                class="text-xs font-semibold text-slate-400 font-mono ml-2 tracking-wider">INDEX.HTML</span>
                        </div>

                        <!-- Copy Button -->
                        <button
                            class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 px-2.5 py-1.5 rounded-md transition-all active:scale-95 cursor-pointer">
                            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2"
                                stroke="currentColor" class="w-3.5 h-3.5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376A8.965 8.965 0 0 0 12 12.75c-.497 0-.982.04-1.455.12l-.104.022m.784-1.155a8.96 8.96 0 0 0-1.933-1.204m10.457-4.487a8.967 8.967 0 0 1-3.708-4.75M4.5 9.375c0-.621.504-1.125 1.125-1.125h9.75c.621 0 1.125.504 1.125 1.125v9.375c0 .621-.504 1.125-1.125 1.125h-9.75A1.125 1.125 0 0 1 4.5 19.875V9.375Z" />
                            </svg>
                            Copy
                        </button>
                    </div>

                    <!-- Code Display Section -->
                    <pre
                        class="p-5 text-sm font-mono text-slate-300 overflow-x-auto bg-[#0d1117] leading-relaxed"><code class="block whitespace-pre">&lt;h3 class="text-xl font-bold"&gt;Lorem ipsum dolor sit amet.&lt;/h3&gt;</code></pre>
                </div>

            </div>

            <!-- right side of Customizer -->
            <div
                class="w-80 bg-[#161b22] border-l rounded-3xl border-slate-800 p-5 font-inter flex flex-col gap-5 text-white">
                <h2 class="text-lg font-bold tracking-tight select-none">CUSTOMIZER</h2>

                <div class="flex flex-col gap-4">
                    <!-- Background Color Input -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-medium text-gray-300">Background Color</label>
                        <input type="text" id="bgColorInput" placeholder="HEX or Tailwind class"
                            class="bg-[#0d1117] border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-slate-700">
                    </div>

                    <!-- Padding Slider -->
                    <div class="flex flex-col gap-1.5">
                        <div class="flex justify-between text-xs text-gray-300">
                            <label>Padding</label>
                            <span id="paddingValue">12px</span>
                        </div>
                        <input type="range" id="paddingSlider" min="0" max="32" value="12"
                            class="w-full h-2 bg-[#0d1117] rounded-lg appearance-none cursor-pointer accent-white">
                    </div>

                    <!-- Text Input -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-medium text-gray-300">Button Text</label>
                        <input type="text" id="textInput" value="Get Started"
                            class="bg-[#0d1117] border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-slate-700">
                    </div>

                    <!-- Border Width Slider -->
                    <div class="flex flex-col gap-1.5">
                        <div class="flex justify-between text-xs text-gray-300">
                            <label>Border Width</label>
                            <span id="borderValue">2px</span>
                        </div>
                        <input type="range" id="borderSlider" min="0" max="8" value="2"
                            class="w-full h-2 bg-[#0d1117] rounded-lg appearance-none cursor-pointer accent-white">
                    </div>

                    <!-- Rounded Corners Checkbox -->
                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="roundedCheckbox" checked
                            class="w-4 h-4 rounded bg-[#0d1117] border-blue-500/30 text-blue-600 focus:ring-0 cursor-pointer">
                        <label for="roundedCheckbox" class="text-xs text-gray-300 cursor-pointer select-none">Rounded
                            Corners</label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- script of JS -->
    <script src="script.js"></script>

</body>

</html>
